openapi: 3.0.3
info:
  title: API MiniBlog
  version: 1.0.0
  description: >
    API REST para gestionar authors, posts y comments de MiniBlog (DevSpark).
    Construida con Node.js, Express y PostgreSQL.

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Health
  - name: Authors
  - name: Posts
  - name: Comments

paths:
  /health:
    get:
      tags: [Health]
      summary: Comprueba que la API está funcionando
      responses:
        '200':
          description: La API responde correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string, example: API MiniBlog funcionando }

  /authors:
    get:
      tags: [Authors]
      summary: Lista todos los authors
      responses:
        '200':
          description: Lista de authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Author' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Authors]
      summary: Crea un author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '201':
          description: Author creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Authors]
      summary: Obtiene el detalle de un author
      responses:
        '200':
          description: Author encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Authors]
      summary: Actualiza un author (reemplaza todos sus campos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '200':
          description: Author actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Author' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Authors]
      summary: Elimina un author
      description: >
        Elimina también sus posts (ON DELETE CASCADE). Sus comentarios en posts
        de otros authors se conservan con author_id en null (ON DELETE SET NULL).
      responses:
        '204':
          description: Author eliminado, sin contenido en la respuesta
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts:
    get:
      tags: [Posts]
      summary: Lista todos los posts
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Post' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Posts]
      summary: Crea un post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Posts]
      summary: Obtiene el detalle de un post
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Posts]
      summary: Actualiza un post (reemplaza todos sus campos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Posts]
      summary: Elimina un post
      description: Elimina también sus comentarios (ON DELETE CASCADE).
      responses:
        '204':
          description: Post eliminado, sin contenido en la respuesta
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/author/{authorId}:
    parameters:
      - name: authorId
        in: path
        required: true
        description: Id del author
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Posts]
      summary: Lista los posts de un author con los datos del author
      description: >
        Responde 200 con una lista vacía si el author existe pero no tiene posts,
        y 404 si el author no existe.
      responses:
        '200':
          description: Posts del author
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostWithAuthor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comments:
    get:
      tags: [Comments]
      summary: Lista todos los comentarios
      responses:
        '200':
          description: Lista de comentarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Comments]
      summary: Crea un comentario en un post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /comments/post/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        description: Id del post
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Comments]
      summary: Lista los comentarios de un post
      description: >
        Responde 200 con una lista vacía si el post existe pero no tiene comentarios,
        y 404 si el post no existe.
      responses:
        '200':
          description: Comentarios del post
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Id numérico del recurso
      schema: { type: integer, minimum: 1 }

  schemas:
    Author:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ana García }
        email: { type: string, format: email, example: ana@example.com }
        bio: { type: string, nullable: true, example: Desarrolladora full-stack apasionada por Node.js }
        created_at: { type: string, format: date-time }

    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, example: Laura Méndez }
        email: { type: string, format: email, example: laura@example.com }
        bio: { type: string, nullable: true, example: Diseñadora UX }

    Post:
      type: object
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Introducción a Node.js }
        content: { type: string, example: Node.js es un runtime de JavaScript... }
        author_id: { type: integer, example: 1 }
        published: { type: boolean, example: true }
        created_at: { type: string, format: date-time }

    PostInput:
      type: object
      required: [title, content, author_id]
      properties:
        title: { type: string, minLength: 1, example: Índices en PostgreSQL }
        content: { type: string, minLength: 1, example: Un índice acelera las búsquedas... }
        author_id: { type: integer, minimum: 1, example: 2 }
        published:
          type: boolean
          default: false
          description: Si no se envía, el post se crea como borrador.

    PostWithAuthor:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            author_name: { type: string, example: Ana García }
            author_email: { type: string, format: email, example: ana@example.com }

    Comment:
      type: object
      properties:
        id: { type: integer, example: 1 }
        content: { type: string, example: Muy buena introducción. }
        post_id: { type: integer, example: 1 }
        author_id:
          type: integer
          nullable: true
          description: Queda en null si el author del comentario fue eliminado.
          example: 2
        author_name:
          type: string
          nullable: true
          description: Solo en los listados. Null si el author fue eliminado.
          example: Carlos Ruiz
        created_at: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [content, post_id, author_id]
      properties:
        content: { type: string, minLength: 1, example: Excelente explicación de REST }
        post_id: { type: integer, minimum: 1, example: 3 }
        author_id: { type: integer, minimum: 1, example: 2 }

    Error:
      type: object
      properties:
        error: { type: string, example: Datos inválidos }
        details:
          type: array
          items: { type: string }
          example: [name es obligatorio y no puede estar vacío]
        detail:
          type: string
          example: Key (author_id)=(999) is not present in table "authors".

  responses:
    BadRequest:
      description: >
        Datos inválidos: campos vacíos, tipos incorrectos, id no numérico,
        email duplicado o referencia a un registro que no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Author no encontrado }
    InternalError:
      description: Error inesperado del servidor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Error interno del servidor }